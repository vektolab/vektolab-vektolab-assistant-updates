<!doctype html>
<html lang="es">
<head>
<script src="./push-config.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vektolab · Administrador</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#111827;background:#f3f4f6}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
.card{width:min(620px,100%);background:#fff;border:1px solid #e5e7eb;border-radius:20px;box-shadow:0 15px 45px rgba(0,0,0,.08);padding:28px}
h1{margin:0 0 6px;font-size:25px}.sub{margin:0 0 24px;color:#6b7280}
label{display:block;font-weight:700;font-size:14px;margin:16px 0 7px}input,textarea{width:100%;border:1px solid #d1d5db;border-radius:12px;padding:13px 14px;font:inherit;outline:none}textarea{min-height:130px;resize:vertical}input:focus,textarea:focus{border-color:#111827;box-shadow:0 0 0 3px rgba(17,24,39,.08)}
.row{display:flex;gap:10px;align-items:center;margin-top:20px}.row input{flex:1}
button{border:0;border-radius:12px;padding:13px 18px;font:inherit;font-weight:800;cursor:pointer;background:#111827;color:#fff}.secondary{background:#fff;color:#111827;border:1px solid #d1d5db}.send{width:100%;margin-top:18px;font-size:16px}.send:disabled{opacity:.55;cursor:wait}
.status{margin-top:18px;padding:13px 14px;border-radius:12px;background:#f9fafb;color:#374151;display:none;white-space:pre-wrap}.status.show{display:block}.status.ok{background:#ecfdf5;color:#065f46}.status.err{background:#fef2f2;color:#991b1b}
.small{font-size:12px;color:#6b7280;margin-top:10px;line-height:1.5}.back{display:inline-block;margin-top:18px;color:#374151;text-decoration:none;font-size:14px}
</style>
</head>
<body>
<main class="card">
  <h1>🔔 Vektolab · Administrador</h1>
  <p class="sub">Envía una notificación push a todos los dispositivos registrados.</p>

  <label for="key">Clave de administrador</label>
  <input id="key" type="password" autocomplete="current-password" placeholder="Clave configurada en Cloudflare">

  <label for="title">Título</label>
  <input id="title" maxlength="120" value="Nuevo en Vektolab">

  <label for="body">Mensaje</label>
  <textarea id="body" maxlength="500" placeholder="Escribe el mensaje que recibirán tus usuarios..."></textarea>

  <label for="url">Al tocar la notificación, abrir</label>
  <input id="url" value="./index.html" placeholder="./index.html">

  <button id="send" class="send">📣 Enviar a todos</button>
  <div id="status" class="status"></div>
  <p class="small">La clave de administrador no se guarda en la página. El envío real se realiza en el Worker de Cloudflare, que mantiene las credenciales privadas de Firebase fuera del navegador.</p>
  <a class="back" href="./index.html">← Volver a Vektolab</a>
</main>
<script>
const $=id=>document.getElementById(id);
const status=$('status');
function show(text,type=''){status.textContent=text;status.className='status show '+type}
$('send').addEventListener('click',async()=>{
  const key=$('key').value.trim(),title=$('title').value.trim(),body=$('body').value.trim(),url=$('url').value.trim()||'./index.html';
  if(!key)return show('Escribe la clave de administrador.','err');
  if(!title)return show('Escribe un título.','err');
  if(!body)return show('Escribe un mensaje.','err');
  $('send').disabled=true;show('Enviando...');
  try{
    const r=await fetch(window.VEKTOLAB_PUSH_API.replace(/\/$/, '') + '/api/send-notification',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({title,body,url})});
    const data=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(data.error||('Error HTTP '+r.status));
    show(`Envío terminado.\nRegistrados: ${data.total ?? 0}\nEnviados: ${data.sent ?? 0}\nFallidos/eliminados: ${data.failed ?? 0}`,'ok');
  }catch(e){show('No se pudo enviar.\n'+e.message,'err')}finally{$('send').disabled=false}
});
</script>
</body>
</html>
