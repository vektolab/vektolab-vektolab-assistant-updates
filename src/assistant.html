<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vekto</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:"Segoe UI",Arial,sans-serif;color:#151515}
.shell{position:absolute;inset:5px;background:rgba(255,255,255,.985);border:1px solid #e5e7eb;border-radius:25px;box-shadow:0 18px 55px rgba(0,0,0,.18);overflow:hidden;display:flex;flex-direction:column}
.header{padding:16px 16px 8px}.brand{display:flex;align-items:center;justify-content:space-between}.name{font-size:18px;font-weight:850;letter-spacing:-.4px}.sub{font-size:11px;color:#68707a;margin-top:2px}.close{width:32px;height:32px;border:0;border-radius:50%;background:#f2f3f5;color:#68707a;font-size:18px;cursor:pointer}.close:hover{background:#e8eaed;color:#111}
.search{margin:6px 12px 10px;height:48px;border:1px solid #d8dde4;border-radius:14px;background:#fafbfc;box-shadow:0 0 0 3px rgba(246,204,75,.28);display:flex;align-items:center;padding:0 14px}.search input{border:0;outline:0;background:transparent;width:100%;font-size:14px;color:#111}.tabs{display:flex;align-items:center;padding:0 16px 10px;gap:6px}.tab{border:0;background:transparent;padding:9px 12px;border-radius:11px;font-weight:750;font-size:12px;color:#68707a;cursor:pointer}.tab.active{background:#f0f1f3;color:#111}.all{margin-left:auto}.content{padding:0 12px 8px;overflow:auto;flex:1}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{border:1px solid #dfe3e8;border-radius:14px;overflow:hidden;background:#fff;cursor:pointer;transition:transform .12s ease,box-shadow .12s ease}.card:hover{transform:translateY(-1px);box-shadow:0 5px 16px rgba(0,0,0,.08)}.thumb{height:128px;background:#f7f8fa;display:flex;align-items:center;justify-content:center;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.ctitle{font-size:12px;font-weight:750;padding:10px 11px 11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.empty{padding:30px 12px;text-align:center;color:#7a818a;font-size:13px}.footer{padding:9px 12px 12px;border-top:1px solid #f0f1f2;background:#fff}.updates{width:100%;height:36px;border:1px solid #dfe3e8;border-radius:11px;background:#fafbfc;font-size:11px;font-weight:750;cursor:pointer}.status{height:16px;margin-top:6px;font-size:10px;color:#7b8188;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.site{padding:2px 0 0;font-size:10px;color:#8a9097;cursor:pointer}.content::-webkit-scrollbar{width:8px}.content::-webkit-scrollbar-thumb{background:#a9adb3;border-radius:10px}.content::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>
<div class="shell">
  <div class="header"><div class="brand"><div><div class="name">Vekto</div><div class="sub">Tu asistente creativo de Vektolab</div></div><button class="close" id="close">×</button></div></div>
  <div class="search"><input id="search" placeholder="Buscar generadores..."></div>
  <div class="tabs"><button class="tab active" data-tab="generators">Generadores</button><button class="tab" data-tab="designs">Diseños</button><button class="tab all" id="all">Ver todos</button></div>
  <main class="content"><div class="grid" id="grid"></div><div class="empty" id="empty" hidden>No encontramos resultados.</div></main>
  <footer class="footer"><button class="updates" id="updates">↻ Buscar actualizaciones</button><div class="status" id="status"></div><div class="site" id="site">Abrir Vektolab.com</div></footer>
</div>
<script src="assistant.js"></script>
</body>
</html>
