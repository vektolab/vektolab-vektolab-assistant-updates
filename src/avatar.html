<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data:; style-src 'self' 'unsafe-inline'; script-src 'self';">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vekto</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}
body{user-select:none;-webkit-user-select:none}
#avatar{position:absolute;inset:8px;border-radius:50%;cursor:grab;filter:drop-shadow(0 8px 18px rgba(0,0,0,.18));transform-origin:50% 78%;touch-action:none;user-select:none}
#avatar.dragging{cursor:grabbing;filter:drop-shadow(0 13px 24px rgba(0,0,0,.25));animation:vektoSway .55s ease-in-out infinite alternate}
#avatar img{width:100%;height:100%;display:block;pointer-events:none;user-select:none;-webkit-user-drag:none}
#avatar.edge-hit{animation:vektoEdgeHit .24s ease-out}
#avatar.dragging.edge-hit{animation:vektoEdgeHit .24s ease-out}
@keyframes vektoSway{from{transform:rotate(calc(var(--tilt,0deg) - 4deg))}to{transform:rotate(calc(var(--tilt,0deg) + 4deg))}}
@keyframes vektoEdgeHit{0%{transform:scale(1) rotate(var(--tilt,0deg))}35%{transform:scale(.86) rotate(calc(var(--tilt,0deg) - 8deg))}70%{transform:scale(1.06) rotate(calc(var(--tilt,0deg) + 5deg))}100%{transform:scale(1) rotate(var(--tilt,0deg))}}
</style>
</head>
<body>
<div id="avatar"><img src="assets/vekto-face.gif" alt="Vekto"></div>
<script src="avatar.js"></script>
</body>
</html>
