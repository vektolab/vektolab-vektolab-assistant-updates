<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
body{display:grid;place-items:center;user-select:none;-webkit-user-select:none}
#avatar{width:88px;height:88px;display:grid;place-items:center;cursor:grab;transform-origin:50% 80%;filter:drop-shadow(0 8px 10px rgba(0,0,0,.16));transition:transform .18s cubic-bezier(.2,.8,.2,1),filter .18s ease}
#avatar.dragging{cursor:grabbing;filter:drop-shadow(0 12px 14px rgba(0,0,0,.22));transform:scale(1.06) rotate(-3deg)}
#avatar.released{animation:release .32s cubic-bezier(.2,1.5,.4,1)}
img{width:88px;height:88px;object-fit:contain;pointer-events:none;-webkit-user-drag:none}
@keyframes release{0%{transform:scale(1.06) rotate(-3deg)}55%{transform:scale(.94,1.04) rotate(2deg)}100%{transform:scale(1) rotate(0)}}
</style>
</head>
<body>
<div id="avatar"><img src="assets/vekto-face.gif" alt="Vekto"></div>
<script src="avatar.js"></script>
</body>
</html>
